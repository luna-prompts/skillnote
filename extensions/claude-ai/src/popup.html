<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SkillNote</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --muted: #6b7280;
      --ok: #10b981;
      --warn: #f59e0b;
      --err: #ef4444;
      --border: #e5e7eb;
      --bg: #ffffff;
      --bg-soft: #f9fafb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #f4f4f5;
        --muted: #9ca3af;
        --border: #27272a;
        --bg: #18181b;
        --bg-soft: #1f1f23;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 340px;
      margin: 0;
      padding: 14px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: var(--fg);
      background: var(--bg);
    }
    h1 { font-size: 14px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 500; }
    .pill.ok { background: #d1fae5; color: #065f46; }
    .pill.warn { background: #fef3c7; color: #78350f; }
    .pill.err { background: #fee2e2; color: #7f1d1d; }
    @media (prefers-color-scheme: dark) {
      .pill.ok { background: #064e3b; color: #d1fae5; }
      .pill.warn { background: #78350f; color: #fef3c7; }
      .pill.err { background: #7f1d1d; color: #fee2e2; }
    }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
    .row + .row { border-top: 1px solid var(--border); }
    .label { color: var(--muted); }
    .value { font-weight: 500; }
    .activity { margin-top: 12px; }
    .activity-title { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .activity-entry { padding: 4px 0; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
    .activity-entry .msg { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .activity-entry .ts { color: var(--muted); font-size: 11px; }
    .activity-entry.error .msg { color: var(--err); }
    .actions { margin-top: 14px; display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-soft);
      color: var(--fg);
      cursor: pointer;
    }
    button:hover { background: var(--border); }
    button.primary {
      background: #2563eb; color: white; border-color: #2563eb;
    }
    button.primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
    .empty { padding: 18px 0; text-align: center; color: var(--muted); font-size: 13px; }
    .empty a, .actions a { color: inherit; text-decoration: underline; }
  </style>
</head>
<body>
  <h1>
    SkillNote
    <span id="status-pill" class="pill warn">…</span>
  </h1>
  <div id="content">Loading…</div>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
