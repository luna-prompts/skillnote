<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SkillNote</title>
  <style>
    /* ── Design tokens — mirrors SkillNote globals.css ─────────────────── */
    :root {
      color-scheme: light dark;
      --fg: #111318;            /* --foreground */
      --fg-soft: #3a3d47;
      --muted: #7a7a8a;         /* --muted-foreground */
      --faint: #a8a8b3;
      --accent: #0d9488;        /* SkillNote teal */
      --accent-hover: #0f766e;
      --primary: #111318;       /* black primary buttons (bg-foreground) */
      --primary-fg: #ffffff;
      --ok: #059669;
      --ok-bg: #d1fae5;
      --ok-fg: #065f46;
      --warn: #d97706;
      --warn-bg: #fef3c7;
      --warn-fg: #92400e;
      --err: #dc2626;           /* --destructive */
      --err-bg: #fee2e2;
      --err-fg: #991b1b;
      --info-bg: #ccfbf1;       /* teal-tinted */
      --info-fg: #115e59;
      --border: #e4e4e8;        /* --border */
      --border-strong: #d4d4d8;
      --bg: #ffffff;            /* --card (the panel surface) */
      --bg-soft: #f7f7f8;       /* --background */
      --bg-sunken: #f0f0f2;     /* --secondary / --muted */
      --radius: 10px;
      --radius-sm: 7px;
      --shadow: 0 1px 2px rgba(17, 19, 24, 0.04), 0 1px 3px rgba(17, 19, 24, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e8e8ed;
        --fg-soft: #c4c4cf;
        --muted: #8b8b9e;
        --faint: #6a6a78;
        --accent: #0d9488;
        --accent-hover: #14b8a6;
        --primary: #e8e8ed;
        --primary-fg: #0f1117;
        --ok: #34d399;
        --ok-bg: #064e3b;
        --ok-fg: #a7f3d0;
        --warn: #fbbf24;
        --warn-bg: #78350f;
        --warn-fg: #fde68a;
        --err: #ef4444;
        --err-bg: #7f1d1d;
        --err-fg: #fecaca;
        --info-bg: #134e4a;
        --info-fg: #99f6e4;
        --border: #252832;
        --border-strong: #3a3d47;
        --bg: #16181f;          /* --card */
        --bg-soft: #0f1117;     /* --background */
        --bg-sunken: #1e2029;   /* --secondary */
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      width: 360px;
      margin: 0;
      padding: 0;
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      color: var(--fg);
      background: var(--bg);
    }

    /* ── Header ────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand .mark { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--border); flex: 0 0 auto; background: #fff; }
    .brand .name { font-weight: 600; font-size: 13.5px; letter-spacing: -0.01em; color: var(--fg); }
    main { padding: 14px 16px 16px; }

    /* ── Pills ─────────────────────────────────────────────────────────── */
    .pill {
      font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
      display: inline-flex; align-items: center; gap: 5px; letter-spacing: 0.01em;
    }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.9; }
    .pill.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
    .pill.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
    .pill.err { background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); }
    .pill.info { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent); }
    .pill.muted { background: var(--bg-sunken); color: var(--muted); }

    /* ── Rows / stats ──────────────────────────────────────────────────── */
    .rows { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--bg-soft); }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; }
    .row + .row { border-top: 1px solid var(--border); }
    .row .label { color: var(--muted); font-size: 12px; }
    .row .value { font-weight: 550; font-size: 12.5px; }
    .row .value.err { color: var(--err); }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 10px; }
    .stat .n { font-size: 17px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; }
    .stat .n.err { color: var(--err); }
    .stat .k { font-size: 10.5px; color: var(--muted); margin-top: 2px; }

    /* ── Buttons ───────────────────────────────────────────────────────── */
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    .btn {
      flex: 1; padding: 8px 12px; font-size: 12.5px; font-weight: 550;
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--fg); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      transition: background 0.12s ease, border-color 0.12s ease, opacity 0.12s ease;
      font-family: inherit;
    }
    .btn:hover { background: var(--bg-sunken); }
    .btn:active { transform: translateY(0.5px); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .btn[disabled] { opacity: 0.55; cursor: default; }
    .btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary); border-color: var(--primary); opacity: 0.9; }
    .btn-danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 35%, transparent); background: transparent; }
    .btn-danger:hover { background: var(--err-bg); }
    .btn-sm { padding: 6px 10px; font-size: 12px; flex: 0 0 auto; }
    .btn .ico { width: 13px; height: 13px; flex: 0 0 auto; }
    .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── CTA block (empty / signin / error states) ─────────────────────── */
    .cta { text-align: center; padding: 8px 4px 4px; }
    .cta .icon {
      width: 38px; height: 38px; border-radius: 50%; margin: 4px auto 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .cta .icon svg { width: 19px; height: 19px; }
    .cta .icon.ok { background: var(--ok-bg); color: var(--ok); }
    .cta .icon.warn { background: var(--warn-bg); color: var(--warn); }
    .cta .icon.err { background: var(--err-bg); color: var(--err); }
    .cta .icon.info { background: var(--info-bg); color: var(--accent); }
    .cta h2 { font-size: 14px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
    .cta p { font-size: 12.5px; color: var(--muted); margin: 0 auto; max-width: 280px; }

    /* ── Pairing code ──────────────────────────────────────────────────── */
    .code-wrap { margin-top: 4px; }
    .code-box {
      display: flex; align-items: stretch; border: 1px solid var(--border-strong);
      border-radius: var(--radius); overflow: hidden; background: var(--bg-soft);
    }
    .code {
      flex: 1; font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 26px; font-weight: 600; letter-spacing: 0.22em;
      text-align: center; padding: 14px 0 14px 0.22em; color: var(--fg);
    }
    .copy {
      flex: 0 0 auto; width: 46px; border: none; border-left: 1px solid var(--border);
      background: var(--bg); color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .copy:hover { background: var(--bg-sunken); color: var(--fg); }
    .copy.copied { color: var(--ok); }
    .copy svg { width: 15px; height: 15px; }
    .countdown { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
    .countdown .t { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--fg-soft); }
    .countdown.urgent .t { color: var(--warn); }
    .countdown.expired { color: var(--err); }

    /* ── Activity ──────────────────────────────────────────────────────── */
    .section-label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--faint); margin: 16px 0 7px; }
    .activity-list { display: flex; flex-direction: column; gap: 1px; }
    .act { display: flex; align-items: center; gap: 9px; padding: 5px 0; font-size: 12px; }
    .act .glyph { flex: 0 0 auto; width: 17px; height: 17px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
    .act .glyph.ok { background: color-mix(in srgb, var(--ok) 13%, transparent); color: var(--ok); }
    .act .glyph.info { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent); }
    .act .glyph.err { background: color-mix(in srgb, var(--err) 13%, transparent); color: var(--err); }
    .act .glyph.muted { background: var(--bg-sunken); color: var(--muted); }
    .act .msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-soft); }
    .act .ts { flex: 0 0 auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
    .act.error .msg { color: var(--err); }
    .empty-act { font-size: 12px; color: var(--faint); padding: 6px 0; text-align: center; }

    .link-row { margin-top: 12px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .link-row a { color: var(--muted); font-size: 11.5px; text-decoration: none; }
    .link-row a:hover { color: var(--fg); text-decoration: underline; }
    .link-row .dot { color: var(--faint); font-size: 11px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <header>
    <span class="brand">
      <img class="mark" src="icons/logo.svg" alt="" />
      <span class="name">SkillNote</span>
    </span>
    <span id="status-pill" class="pill muted">…</span>
  </header>
  <main id="content" aria-live="polite">Loading…</main>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
