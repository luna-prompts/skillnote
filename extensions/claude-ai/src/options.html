<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SkillNote — Settings</title>
  <style>
    /* ── Design tokens — mirrors SkillNote globals.css ─────────────────── */
    :root {
      /* Light mode only — matches the popup; the plugin is a fixed, branded
         surface that should always look like the SkillNote app. Token values
         are shared with popup.html — keep the two in lockstep. */
      color-scheme: light;
      --fg: #1d1c18;            /* warm near-black (matches claude.ai) */
      --fg-soft: #45433c;
      --muted: #75726a;
      --faint: #a3a097;
      --accent: #0d9488;        /* SkillNote teal */
      --accent-hover: #0f766e;
      --primary: #1d1c18;       /* warm near-black buttons */
      --primary-fg: #ffffff;
      --ok: #0f9d6e;
      --ok-bg: #d8f3e6;
      --ok-fg: #065f46;
      --warn: #d97706;
      --warn-bg: #fbf2dd;
      --warn-fg: #92400e;
      --err: #dc2626;           /* --destructive */
      --err-bg: #fdeceb;
      --err-fg: #991b1b;
      --info-bg: #ccfbf1;       /* teal-tinted */
      --info-fg: #115e59;
      --border: #eae8e1;        /* warm hairline */
      --border-strong: #ddd9cf;
      --bg: #f7f6f1;            /* warm paper canvas (matches claude.ai) */
      --bg-soft: #ffffff;       /* card */
      --bg-sunken: #efede6;     /* secondary / muted — warm */
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 1px 2px rgba(17,19,24,0.04), 0 4px 12px rgba(17,19,24,0.05);
    }
    /* Dark theme — applied via data-theme="dark" to match claude.ai. */
    [data-theme="dark"] {
      color-scheme: dark;
      --fg: #ece9e1;
      --fg-soft: #c2bdb1;
      --muted: #98938a;
      --faint: #6b675e;
      --accent: #2dd4bf;
      --accent-hover: #5fe3d4;
      --primary: #ece9e1;
      --primary-fg: #232220;
      --ok: #34d399; --ok-bg: #16352a; --ok-fg: #a7f3d0;
      --warn: #fbbf24; --warn-bg: #3a3115; --warn-fg: #fde68a;
      --err: #f87171; --err-bg: #3a2422; --err-fg: #fecaca;
      --info-bg: #163b38; --info-fg: #99f6e4;
      --border: #3b3934; --border-strong: #4a473f;
      --bg: #262522; --bg-soft: #302f2c; --bg-sunken: #3a3833;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 12px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      max-width: 560px;
      margin: 56px auto;
      padding: 0 24px;
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--fg);
      background: var(--bg);
    }

    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .mark { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); flex: 0 0 auto; background: #fff; }
    h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.02em; }
    p.lede { color: var(--muted); margin: 0 0 28px; font-size: 14px; }

    .card { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }

    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
    input[type="text"], input[type="url"] {
      width: 100%; padding: 10px 12px; font-size: 14px; font-family: inherit;
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--fg); transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
    input[aria-invalid="true"] { border-color: var(--err); }
    .hint { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
    .hint code { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; background: var(--bg-sunken); padding: 1px 5px; border-radius: 4px; }
    .err-text { margin-top: 7px; font-size: 12.5px; color: var(--err); min-height: 1em; }

    /* ── Buttons ───────────────────────────────────────────────────────── */
    .btn {
      padding: 9px 16px; font-size: 13.5px; font-weight: 600; font-family: inherit;
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--fg); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      transition: background 0.12s ease, border-color 0.12s ease, opacity 0.12s ease;
    }
    .btn:hover { background: var(--bg-sunken); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .btn[disabled] { opacity: 0.55; cursor: default; }
    .btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary); border-color: var(--primary); opacity: 0.9; }
    .btn-danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 35%, transparent); background: transparent; }
    .btn-danger:hover { background: var(--err-bg); }
    .btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
    .btn-ghost:hover { background: var(--bg-sunken); color: var(--fg); }
    .ico { width: 15px; height: 15px; flex: 0 0 auto; }
    .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* ── Pills ─────────────────────────────────────────────────────────── */
    .pill { font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
    .pill.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
    .pill.info { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent); }

    /* ── Pairing code ──────────────────────────────────────────────────── */
    .code-box { display: flex; align-items: stretch; border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; background: var(--bg); }
    .code { flex: 1; font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; font-size: 32px; font-weight: 600; letter-spacing: 0.28em; text-align: center; padding: 20px 0 20px 0.28em; }
    .copy { flex: 0 0 auto; width: 58px; border: none; border-left: 1px solid var(--border); background: var(--bg-soft); color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.12s, color 0.12s; }
    .copy:hover { background: var(--bg-sunken); color: var(--fg); }
    .copy.copied { color: var(--ok); }
    .copy svg { width: 18px; height: 18px; }
    .countdown { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
    .countdown .t { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--fg-soft); }
    .countdown.urgent .t { color: var(--warn); }
    .countdown.expired { color: var(--err); }

    /* ── Notices ───────────────────────────────────────────────────────── */
    .notice { display: flex; gap: 11px; padding: 13px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-top: 4px; }
    .notice .ico { margin-top: 1px; }
    .notice.warn { background: var(--warn-bg); color: var(--warn-fg); }
    .notice.info { background: var(--bg-sunken); color: var(--fg-soft); }
    .notice a { color: inherit; font-weight: 600; }

    .meta-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .browser-label { color: var(--muted); font-size: 13px; }

    /* ── Connection details (moved here from the popup main tab) ───────── */
    .conn { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--bg); }
    .conn-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; }
    .conn-row + .conn-row { border-top: 1px solid var(--border); }
    .conn-row .k { color: var(--muted); font-size: 13px; }
    .conn-row .v { font-size: 13px; font-weight: 550; color: var(--fg); display: inline-flex; align-items: center; gap: 7px; }
    .conn-row .v.plain { font-weight: 500; color: var(--muted); }
    .conn-row .v .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.err { background: var(--err); }
    .section-h { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--faint); margin: 0 0 8px; }
    hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    .muted { color: var(--muted); font-size: 13px; }
    .stack > * + * { margin-top: 16px; }
    .confirm { background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; }
    .confirm p { margin: 0 0 12px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="head">
    <img class="mark" src="icons/logo.svg" alt="" />
    <div>
      <h1>SkillNote</h1>
      <div style="font-size:11.5px; color:var(--faint); letter-spacing:0.01em; margin-top:1px;">claude.ai connector</div>
    </div>
  </div>
  <p class="lede">Sync your self-hosted SkillNote skills to your claude.ai account.</p>
  <div id="root">Loading…</div>
  <script type="module" src="./options.ts"></script>
</body>
</html>
